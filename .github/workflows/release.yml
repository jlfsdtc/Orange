name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # ---------- macOS ----------
      - name: Build macOS .app and .dmg
        if: matrix.target == 'macos'
        run: bash scripts/package-macos.sh

      - name: Upload macOS artifacts
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: orange-macos
          path: |
            target/packaging/macos/orange.app
            target/packaging/macos/*.dmg

      # ---------- Linux ----------
      - name: Install Linux build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev \
            file desktop-file-utils

      - name: Install cargo-deb and cargo-generate-rpm
        if: matrix.target == 'linux'
        run: |
          cargo install --locked cargo-deb
          cargo install --locked cargo-generate-rpm

      - name: Build Debian package
        if: matrix.target == 'linux'
        run: bash scripts/package-deb.sh

      - name: Build RPM package
        if: matrix.target == 'linux'
        run: bash scripts/package-rpm.sh

      - name: Build AppImage
        if: matrix.target == 'linux'
        run: bash scripts/package-appimage.sh

      - name: Upload Linux artifacts
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: orange-linux
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            target/appimage/*.AppImage

      # ---------- Windows ----------
      - name: Install NSIS
        if: matrix.target == 'windows'
        run: |
          choco install nsis -y --no-progress
          # EnVar plugin
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri https://nsis.sourceforge.io/mediawiki/images/7/7f/EnVar_plugin.zip -OutFile EnVar.zip
          Expand-Archive -Path EnVar.zip -DestinationPath "$env:ProgramFiles (x86)\NSIS" -Force

      - name: Build Windows installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: pwsh -File scripts/package-windows.ps1

      - name: Upload Windows artifacts
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: orange-windows
          path: target/windows/*.exe

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/orange-macos/*
            artifacts/orange-linux/*
            artifacts/orange-windows/*
